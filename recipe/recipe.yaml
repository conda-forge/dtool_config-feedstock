schema_version: 1

context:
  name: dtool_config
  version: "0.4.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/dtool-config/${{ name }}-${{ version }}.tar.gz
  sha256: f71e6c48a5c4888cd8bb1dec61c58ecb1a5a4c50fc64c001e89de4bd33556ba8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - click
    - setuptools
    - dtoolcore
    - dtool_cli
    - setuptools <80

tests:
  - python:
      imports:
        - dtool_config
        - dtool_config.cli
        - dtool_config.utils
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - dtool config --help

about:
  license: MIT
  license_file: LICENSE.rst
  summary: dtool CLI commands for configuring dtool settings
  homepage: https://github.com/jic-dtool/dtool-config
  repository: https://github.com/jic-dtool/dtool-config
  documentation: https://github.com/jic-dtool/dtool-config

extra:
  recipe-maintainers:
    - pvanheus
    - jan-janssen
    - tjelvar-olsson
